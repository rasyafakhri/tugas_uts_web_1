<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <h2>Login Toko Buku</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email...">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password...">
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <div class="login-links">
            <a href="#" onclick="openModal('modalLupa')">Lupa Password?</a> | 
            <a href="#" onclick="openModal('modalDaftar')">Daftar Akun</a>
        </div>
    </div>

    <!-- Modal Box Lupa Password -->
    <div id="modalLupa" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modalLupa')">&times;</span>
            <h3>Reset Password</h3>
            <p>Fitur pemulihan password akan mengirimkan instruksi ke email Anda.</p>
        </div>
    </div>

    <!-- Modal Box Daftar -->
    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modalDaftar')">&times;</span>
            <h3>Pendaftaran Akun Baru</h3>
            <p>Silakan hubungi administrator sistem untuk pembuatan akun baru.</p>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>

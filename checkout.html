<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pemesanan - Toko Buku</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <h2>Toko Buku Online</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Katalog Stok</a>
            <a href="checkout.html" class="active">Pemesanan</a>
            <a href="tracking.html">Tracking</a>
            <a href="index.html" class="btn-logout">Logout</a>
        </nav>
    </header>

    <main class="container">
        <h2>Formulir Pemesanan Buku Ajar</h2>
        <div class="checkout-wrapper" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <form id="formCheckout" class="card-form">
                <h3>Data Informasi Pemesan</h3>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="namaPemesan" required placeholder="Masukkan nama Anda...">
                </div>
                <div class="form-group">
                    <label>Alamat Pengiriman</label>
                    <textarea id="alamatPemesan" rows="3" required placeholder="Masukkan alamat lengkap..."></textarea>
                </div>
                <div class="form-group">
                    <label>Pilih Buku</label>
                    <select id="pilihanBuku" required>
                        <option value="">-- Pilih Buku Ajar --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Jumlah Pesan</label>
                    <input type="number" id="jumlahPesan" min="1" value="1" required>
                </div>
                <button type="submit" class="btn-primary">Proses Pesanan</button>
            </form>

            <div class="card-form" id="ringkasanPesanan" style="display:none;">
                <h3>Ringkasan Pemesanan</h3>
                <p><strong>Nama:</strong> <span id="resNama"></span></p>
                <p><strong>Alamat:</strong> <span id="resAlamat"></span></p>
                <p><strong>Buku:</strong> <span id="resBuku"></span></p>
                <p><strong>Total Harga:</strong> <span id="resTotal" style="color: #27ae60; font-weight: bold; font-size: 1.1rem;"></span></p>
                <button onclick="alert('Pesanan berhasil dikonfirmasi dan diproses!')" class="btn-primary" style="margin-top: 15px; background-color: #27ae60;">Konfirmasi Pembayaran</button>
            </div>
        </div>
    </main>

    <!-- Urutan script: data.js wajib dipanggil sebelum script.js -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
